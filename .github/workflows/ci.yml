# ---------------------------------------------------------------------------
# my-cow-rest CI/CD
#   every push / pull request -> run the PHPUnit suite against a real MySQL
#   push a tag like v9        -> tests, then build + push charmzzy/cow-rest:v9 (amd64 + arm64) to Docker Hub,
#                                then deploy it to the VPS (when DEPLOY_ENABLED=true)
# Repo secrets needed (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (a Docker Hub access token, not your password)
#   VPS_HOST, VPS_USER, VPS_SSH_KEY (deploy key; see deploy-app/RUNBOOK-vps.md)
# ---------------------------------------------------------------------------
name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

# A newer push to the same branch cancels the older, still-running pipeline
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    # A throwaway MySQL next to the job. Same version as production; the migrations use MySQL-only SQL.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cowbreed_test     # phpunit.xml forces this name
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=3s --health-retries=20

    # No .env file in CI: Laravel reads real environment variables instead.
    # The key is a test-only key (also in docker-compose.test.yml); it protects nothing real.
    env:
      APP_KEY: base64:3ZXJpF73RBNn2uPcg5dTMFEGYai2lKyeos5TjHtL2DI=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      # Same PHP minor as the Docker image (php:8.2-cli) and composer.json's platform pin
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql, zip, mbstring, dom, fileinfo
          coverage: none

      # vendor/ only changes when composer.lock does: cache it to skip ~1 min per run
      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      # Full install (with dev): PHPUnit, Faker, etc. The production image uses --no-dev.
      - run: composer install --no-interaction --no-progress --prefer-dist

      - run: php artisan test

  publish:
    # Only for version tags, and only when the tests passed
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # QEMU lets this x86 runner build the arm64 image too (the Oracle ARM server). Slower, but no extra setup.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Builds the Dockerfile's last stage (production). github.ref_name = the tag, e.g. v9.
      # Both architectures under one tag: WSL / x86 pulls amd64, the Oracle VM pulls arm64.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            charmzzy/cow-rest:${{ github.ref_name }}
            charmzzy/cow-rest:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Turned on per repo with the variable DEPLOY_ENABLED=true (Settings -> Secrets and variables -> Actions -> Variables)
    if: startsWith(github.ref, 'refs/tags/v') && vars.DEPLOY_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-latest
    steps:
      # The server's deploy key may ONLY run deploy.sh (forced command in authorized_keys), which
      # pulls the tag, migrates, health-checks and rolls back by itself if the check fails.
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: /srv/mycow/deploy.sh rest ${{ github.ref_name }}
